[workspace]
members = [
    "tree-sitter-inspector",
    "wasmtime-compiler"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer"]

[workspace.dependencies]
wasmtime = { version = "22.0.0", default-features = false }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3         # Maximize runtime execution and startup speed
lto = true            # Enable Link-Time Optimization
codegen-units = 1     # Maximize LTO optimization scope
strip = true          # Strip symbols and debuginfo
panic = "abort"       # Abort on panic to remove unwinding tables

