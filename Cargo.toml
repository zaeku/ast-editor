[workspace]
members = [
    "tree-sitter-inspector"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer"]
rust-version = "1.74.1"
homepage = "https://tree-sitter.github.io/tree-sitter"
repository = "https://github.com/tree-sitter/tree-sitter"
license = "MIT"
keywords = ["incremental", "parsing"]
categories = ["command-line-utilities", "parsing"]

[workspace.dependencies]
wasmtime = { version = "19", default-features = false }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.10.4"
cc = "1.0.95"

[profile.release]
opt-level = 3         # Maximize runtime execution and startup speed
lto = true            # Enable Link-Time Optimization
codegen-units = 1     # Maximize LTO optimization scope
strip = true          # Strip symbols and debuginfo
panic = "abort"       # Abort on panic to remove unwinding tables

[patch.crates-io]
tree-sitter = { path = "third_party/tree-sitter/lib" }

