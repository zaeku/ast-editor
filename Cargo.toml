[package]
name = "ast-editor"
version = "0.3.4"
edition = "2021"
authors = ["Park Jaeku <park@jaeku.kr>"]
rust-version = "1.88"
description = "Line-precise editing over tree-sitter: ids that survive an edit, so a file is changed without being reread."
homepage = "https://github.com/zaeku/ast-editor"
repository = "https://github.com/zaeku/ast-editor"
license = "MIT"
readme = "README.md"
keywords = ["tree-sitter", "ast", "editing", "cli", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Core parser
tree-sitter = "0.26.10"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
dirs = "5.0.1"
sha1 = "0.10.6"
sha2 = "0.10.8"
once_cell = "1.21.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10.4"
comrak = "0.28.0"
similar = { version = "2.7.0", features = ["text"] }
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-html = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-nix = "0.3"
tree-sitter-lua = "0.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-language = "0.1.3"

[profile.release]
opt-level = 3         # Maximize runtime execution and startup speed
lto = true            # Enable Link-Time Optimization
codegen-units = 1     # Maximize LTO optimization scope
strip = true          # Strip symbols and debuginfo
panic = "abort"       # Abort on panic to remove unwinding tables
