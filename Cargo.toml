[package]
name = "ast-editor"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer"]
rust-version = "1.74.1"
homepage = "https://tree-sitter.github.io/tree-sitter"
repository = "https://github.com/tree-sitter/tree-sitter"
license = "MIT"
keywords = ["incremental", "parsing"]
categories = ["command-line-utilities", "parsing"]

[dependencies]
# Core parser
tree-sitter = { version = "0.26.10", features = ["wasm"] }
wasmtime = { version = "=36.0.12", default-features = true, features = ["cache"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
dirs = "5.0.1"
sha1 = "0.10.6"
sha2 = "0.10.8"
once_cell = "1.21.4"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10.4"
cc = "1.0.95"
comrak = "0.28.0"

[profile.release]
opt-level = 3         # Maximize runtime execution and startup speed
lto = true            # Enable Link-Time Optimization
codegen-units = 1     # Maximize LTO optimization scope
strip = true          # Strip symbols and debuginfo
panic = "abort"       # Abort on panic to remove unwinding tables
